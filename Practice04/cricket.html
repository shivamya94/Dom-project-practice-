<!DOCTYPE html>
<html lang="en">
<head>
    <title>Cricket Game</title>
    <style>
        body{
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Bat Ball Stump Game</h1>
    <button onclick="
     let ComputerChoice = generateComputerChoice();
     let resultMsg = getResult('Bat', ComputerChoice);
     
     showResult('Bat',ComputerChoice,resultMsg);

    ">Bat</button>
 
    <button onclick="
     ComputerChoice = generateComputerChoice();
     resultMsg = getResult('Ball', ComputerChoice);
     showResult('Ball',ComputerChoice,resultMsg);
    
        
     ">Ball</button>
    
    <button onclick="
      ComputerChoice = generateComputerChoice();
      resultMsg = getResult('Stump', ComputerChoice);
      showResult('Stump',ComputerChoice,resultMsg);
     
    ">Stump</button>

    <button onclick="localStorage.clear()
        resetScore(scoreStr);
        ">Reset</button>

        <h3 id="user-move"></h3>
        <h3 id="computer-move"></h3>
        <h3 id="result"></h3>
        <h3 id="score"></h3>

    <script>
        let scoreStr = localStorage.getItem('Score');
        let score;
        resetScore(scoreStr);

        function resetScore(scoreStr) {
            score = scoreStr ? JSON.parse(scoreStr) : {
            win: 0,
            tie: 0,
            lost: 0,
        };
        
        score.displayScore = function() {
            return ` No of matches Won:${score.win}, Lost:${score.lost}, Tie:${score.tie}`;
            };
        }

        function generateComputerChoice() {
            let randomNumber = Math.random() * 3;
            if (randomNumber > 0 && randomNumber <=1) {
                    return 'Bat';
            } else if (randomNumber > 1 && randomNumber <=2) {
                    return 'Ball';
            } else {
                    return 'Stump'
            }
        }

        function getResult(userMove,ComputerMove) {
            if (userMove === 'Bat'){
                    if (ComputerMove === 'Ball') {
                        score.win++;
                        return 'User won';
                        
                    }else if (ComputerMove === 'Bat') {
                        score.tie++;
                        return `It's a tie`;
                       
                    }else if (ComputerMove === 'Stump') {
                        score.lost++;
                        return 'Computer won';
                        
                    }

            }else if(userMove ==='Ball'){
                if (ComputerMove === 'Ball') {
                        score.lost++;
                        return `It's a tie`;
                        
                    }else if (ComputerMove === 'Bat') {
                        score.lost++;
                        return 'Computer won';
                       
                    }else if (ComputerMove === 'Stump') {
                        score.win++
                        return 'User won';
                       
                    }

            }else{
                if (ComputerMove === 'Ball'){
                    score.lost++;
                    return 'Computer has won';
               
                    }else if(ComputerMove === 'Bat') {
                        score.win++;
                        return'User won';
                      
                    }else if(ComputerMove === 'stump') {
                        score.tie++;
                        return `it's a tie`;
                        
                    }
            }

         }
         function showResult(userMove,ComputerMove,result){
            localStorage.setItem('Score',JSON.stringify(score));
            
            document.querySelector('#user-move').innerHTML =  `You have 
            chosen ${userMove} `;
            document.querySelector('#computer-move').innerHTML =  `Computer Choice is 
             ${computerMove} `;
            document.querySelector('#result').innerHTML = result;
            document.querySelector('#score').innerHTML = score.displayScore();

         }
    </script>
    
</body>
</html>
