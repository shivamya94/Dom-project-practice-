<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Array-concatenate</title>
</head>
<body>
    <script>
        var a = 0;
        document.write(a + "<br><br>");

        if(Array.isArray(a)) {
            document.write("This is An Array");
        }
        else {
            document.write("This is not an Array ");
        }
    </script>
    
</body>
</html>
