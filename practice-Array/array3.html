<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array-concatenate</title>
</head>
<body>
    <script>
        var a = ["sanjay", "Aman", "Raj", "Osho"];
        var b = a.concat("Rahul", "Karan");
        var d = b.concat("Raman","Raghav","Parul");
        document.write(d);

    </script>
    
</body>
</html>
